services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: zylar_elasticsearch
    env_file:
      - ../.env
    environment:
      - node.name=zylar_node
      - cluster.name=zylar_cluster
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ZYLAR_ELASTICSEARCH_PASSWORD}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - zylar_net
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    container_name: zylar_kibana
    env_file:
      - ../.env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ZYLAR_ELASTICSEARCH_PASSWORD}
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - zylar_net
    depends_on:
      - elasticsearch

networks:
  zylar_net:
    driver: bridge

volumes:
  es_data:
    driver: local
