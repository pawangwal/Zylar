[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "zylar"
version = "0.1.0"
description = "Local AI-assisted security operations centre prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zylar contributors" }]
dependencies = [
  "alembic==1.15.1",
  "apscheduler==3.11.3",
  "bcrypt==5.0.0",
  "elasticsearch==8.19.3",
  "fastapi==0.162.0",
  "fpdf2==2.8.9",
  "langchain-core==0.3.86",
  "langgraph==0.6.11",
  "networkx==3.7",
  "numpy==2.5.4",
  "ollama==0.6.3",
  "pandas==2.3.3",
  "psycopg[binary]==3.2.5",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pyjwt==2.15.1",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "sqlalchemy==2.0.40",
  "streamlit==1.66.1",
  "streamlit-autorefresh==1.0.1",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zylar"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --cov=zylar --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["zylar"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/zylar"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pyright]
include = ["src/zylar"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
