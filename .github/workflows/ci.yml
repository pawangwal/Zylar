name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ZYLAR_ENVIRONMENT: test
      ZYLAR_REQUIRE_POSTGRES: "1"
      ZYLAR_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/zylar
      - name: Type check application package
        run: mypy src/zylar
      - name: Run database migrations
        run: python -m alembic upgrade head
      - name: Test
        run: pytest
      - name: Build distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .
